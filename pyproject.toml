[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekap-isbak-rag"
version = "1.0.0"
description = "EKAP İSBAK İhale Analiz Servisi - Uçtan Uca İKN Karar Motoru"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mert", email = "merte@example.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "faiss-cpu>=1.7.4",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
    "ollama>=0.1.6",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --strict-markers -p no:warnings"
markers = [
    "external: marks tests that require external services (PostgreSQL, Qdrant, Ollama)"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "W291"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
